<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SolanaPay — {% block title %}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --p: #4F46E5; --g: #16A34A; --o: #F59E0B;
  --bg: #FFFFFF; --card: #F8F9FA; --card2: #FFFFFF;
  --border: #D1D5DB; --text: #111827; --muted: #6B7280;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 50% at 15% 20%,rgba(153,69,255,.1) 0%,transparent 60%),
             radial-gradient(ellipse 60% 40% at 85% 80%,rgba(20,241,149,.07) 0%,transparent 60%);
  pointer-events:none;z-index:0;}

nav{position:sticky;top:0;z-index:100;background:#FFFFFF;
    backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
    padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.brand{font-size:1.25rem;font-weight:800;letter-spacing:-0.5px;
       background:linear-gradient(135deg,var(--p),var(--g));
       -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-pill{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--g);
          background:rgba(20,241,149,.08);border:1px solid rgba(20,241,149,.2);
          padding:5px 12px;border-radius:20px;}
.nav-links{display:flex;gap:4px;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:600;
             padding:6px 14px;border-radius:8px;transition:all .2s;}
.nav-links a:hover{color:var(--text);background:var(--card2);}
.nav-links a.active{color:var(--p);}

main{position:relative;z-index:1;}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;}
.card+.card,.card+.section{margin-top:16px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
     padding:12px 24px;border-radius:12px;font-family:'Syne',sans-serif;
     font-size:.92rem;font-weight:700;cursor:pointer;border:none;
     text-decoration:none;transition:all .2s;letter-spacing:.2px;}
.btn-primary{background:linear-gradient(135deg,var(--p),#7730d0);color:#fff;}
.btn-primary:hover{opacity:.85;transform:translateY(-2px);box-shadow:0 8px 24px rgba(153,69,255,.35);}
.btn-green{background:linear-gradient(135deg,#0fbc75,var(--g));color:#FFFFFF;}
.btn-green:hover{opacity:.85;transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,241,149,.3);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--p);color:var(--p);}
.btn-danger{background:transparent;border:1px solid rgba(255,80,80,.3);color:#ff6060;}
.btn-danger:hover{background:rgba(255,80,80,.1);}
.btn-full{width:100%;}

/* FORM */
.field{margin-bottom:18px;}
.field label{display:block;margin-bottom:8px;color:var(--muted);font-size:.82rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.field input{width:100%;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;
             padding:13px 16px;color:var(--text);font-family:'DM Mono',monospace;font-size:.88rem;
             outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--p);}
.field input::placeholder{font-family:'Syne',sans-serif;color:var(--muted);font-size:.85rem;}

/* ALERTS */
.alert{padding:14px 18px;border-radius:12px;margin-bottom:18px;font-size:.88rem;font-weight:600;}
.alert-err{background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.25);color:#ff7070;}
.alert-ok {background:rgba(20,241,149,.08);border:1px solid rgba(20,241,149,.25);color:var(--g);}

/* TX LIST */
.tx-list{list-style:none;}
.tx-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
         justify-content:center;font-size:1.1rem;flex-shrink:0;}
.tx-icon.out{background:rgba(255,80,80,.1);}
.tx-icon.in {background:rgba(20,241,149,.1);}
.tx-info{flex:1;min-width:0;}
.tx-name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-sub{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:2px;}
.tx-amt{font-weight:800;font-size:.95rem;flex-shrink:0;}
.tx-amt.out{color:#ff7070;} .tx-amt.in{color:var(--g);}

/* BADGE */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
.badge-ok  {background:rgba(20,241,149,.1);color:var(--g);border:1px solid rgba(20,241,149,.25);}
.badge-err {background:rgba(255,80,80,.1); color:#ff7070;border:1px solid rgba(255,80,80,.25);}
.badge-qr  {background:rgba(153,69,255,.1);color:#c088ff;border:1px solid rgba(153,69,255,.25);}

/* MONO */
.mono{font-family:'DM Mono',monospace;}

/* SECTION LABEL */
.sec-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr;}}

/* STAT */
.stat-label{font-size:.75rem;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.stat-val  {font-size:1.5rem;font-weight:800;}

.container{max-width:960px;margin:0 auto;padding:36px 24px;}
.wrap-sm{max-width:520px;margin:0 auto;padding:36px 24px;}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:.9rem;}
.empty .emoji{font-size:2.5rem;margin-bottom:12px;}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if session.wallet_address %}
<nav>
  <div class="brand">◎ SolanaPay</div>
  <div class="nav-right">
    <div class="nav-pill">🟣 {{ session.wallet_address[:6] }}...{{ session.wallet_address[-4:] }}</div>
    <div class="nav-links">
      <a href="/dashboard" {% if request.path=='/dashboard' %}class="active"{% endif %}>Home</a>
      <a href="/create-qr" {% if request.path=='/create-qr' %}class="active"{% endif %}>Create QR</a>
      <a href="/send"      {% if request.path=='/send' %}class="active"{% endif %}>Send</a>
      <a href="/explorer"  {% if request.path=='/explorer' %}class="active"{% endif %}>Explorer</a>
      <a href="#" onclick="disconnect()" style="color:#ff6060">Disconnect</a>
    </div>
  </div>
</nav>
{% endif %}
<main>{% block content %}{% endblock %}</main>

{% if session.wallet_address %}
<script>
async function disconnect(){
  const p=window.phantom?.solana||window.solana;
  if(p?.isConnected){try{await p.disconnect();}catch(e){}}
  await fetch("/api/disconnect-wallet",{method:"POST"});
  window.location.href="/";
}
</script>
{% endif %}
</body>
</html>
